server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10 # mỗi giây cấp 10 token
            redis-rate-limiter.burstCapacity: 20 # tích lũy tối đa 20 token
            redis-rate-limiter.requestedTokens: 1 # mỗi request tốn 1 token
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/doctors/**,/api/v1/users/**
        - id: schedule-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/schedule/**,/api/v1/time-slot/**
        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/schedules/**

firebase:
  service-account:
    path: classpath:firebase-service-account.json

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
