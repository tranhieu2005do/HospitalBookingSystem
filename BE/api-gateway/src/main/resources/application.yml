server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      default-filters: 
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: booking-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payments/**
        - id: doctor-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/doctors/**
        - id: schedule-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/schedules/**

firebase:
  service-account:
    path: firebase-service-account.json

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
